<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INKPREVIEW</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0f0f12;
            color: #f4f4f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 540px;
            min-height: 100vh;
            background: #19191e;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .brand {
            font-size: 1.15rem;
            font-weight: 800;
        }

        .price-pill {
            background: rgba(230, 57, 70, 0.2);
            border: 1px solid #e63946;
            color: #ffd6da;
            padding: 6px 12px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .status-box {
            font-size: 12px;
            color: #ffd6da;
            background: #2b191d;
            border: 1px solid #692830;
            padding: 7px 10px;
            border-radius: 8px;
            display: none;
        }

        .row-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn {
            width: 100%;
            background: #25252d;
            color: #f4f4f8;
            border: 1px solid #363642;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-sm {
            padding: 7px 10px;
            font-size: 0.8rem;
        }

        .btn-primary {
            background: #e63946;
            border-color: #e63946;
            color: #ffffff;
        }

        .stage {
            position: sticky;
            top: 6px;
            z-index: 20;
            width: 100%;
            aspect-ratio: 4 / 5;
            max-height: 290px;
            background: #121216;
            border: 1px solid #383844;
            border-radius: 14px;
            overflow: hidden;
            touch-action: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
        }

        #bodyCanvas,
        #cameraVideo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            z-index: 1;
        }

        #cameraVideo {
            display: none;
            z-index: 2;
        }

        .stage.camera-on #cameraVideo {
            display: block;
        }

        .stage.camera-on #bodyCanvas {
            display: none;
        }

        .camera-bar {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: none;
            gap: 8px;
        }

        .stage.camera-on .camera-bar {
            display: flex;
        }

        #tattooLayer {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) rotate(0deg);
            transform-origin: center center;
            z-index: 5;
            cursor: grab;
            touch-action: none;
            user-select: none;
        }

        #tattooCanvas {
            display: block;
            width: 140px;
            height: 140px;
            pointer-events: none;
            mix-blend-mode: multiply;
        }

        .tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .tab {
            flex: 0 0 auto;
            background: #25252d;
            color: #b4b4c4;
            border: 1px solid #363642;
            border-radius: 999px;
            padding: 7px 14px;
            font-size: 0.84rem;
            font-weight: 700;
            cursor: pointer;
        }

        .tab.active {
            background: #e63946;
            border-color: #e63946;
            color: #ffffff;
        }

        .gallery {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0;
        }

        .thumb {
            flex: 0 0 68px;
            width: 68px;
            height: 68px;
            background: #ffffff;
            border: 2px solid #363642;
            border-radius: 10px;
            padding: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thumb.active {
            border-color: #ff5964;
            box-shadow: 0 0 0 1px #ff5964;
        }

        .thumb canvas {
            width: 60px;
            height: 60px;
            display: block;
            pointer-events: none;
        }

        .panel {
            background: #222229;
            border: 1px solid #32323d;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .ctrl {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .ctrl label {
            font-size: 0.8rem;
            color: #b4b4c4;
            display: flex;
            justify-content: space-between;
        }

        .ctrl label span {
            color: #ffffff;
            font-weight: 700;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #e63946;
        }

        select {
            width: 100%;
            background: #15151a;
            color: #f4f4f8;
            border: 1px solid #363642;
            border-radius: 8px;
            padding: 8px;
            font-size: 0.86rem;
        }

        .preset-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .chip {
            background: #15151a;
            color: #f4f4f8;
            border: 1px solid #363642;
            border-radius: 999px;
            padding: 5px 10px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
        }

        .chip.active {
            background: #e63946;
            border-color: #e63946;
            color: #ffffff;
        }

        .save-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            z-index: 60;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 14px;
        }

        .save-modal.open {
            display: flex;
        }

        .save-card {
            width: 100%;
            max-width: 440px;
            background: #1c1c22;
            border: 1px solid #383844;
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .save-card img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            display: block;
            background: #101014;
        }

        .save-hint {
            font-size: 0.82rem;
            color: #d7d7e2;
            text-align: center;
        }

        @media (max-width: 400px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="brand">INKPREVIEW</div>
            <div class="price-pill" id="priceDisplay">Odhad ceny: 100 €</div>
        </header>

        <div id="statusBox" class="status-box"></div>

        <div class="row-actions">
            <button type="button" class="btn btn-primary" id="cameraBtn">📷 Odfotiť telo</button>
            <button type="button" class="btn" id="uploadBodyBtn">🖼️ Nahrať fotku</button>
        </div>

        <input type="file" id="bodyFileInput" accept="image/*" style="display:none;" />
        <input type="file" id="nativeCamInput" accept="image/*" capture="environment" style="display:none;" />
        <input type="file" id="tattooFileInput" accept="image/*" style="display:none;" />

        <div class="stage" id="stage">
            <canvas id="bodyCanvas" width="500" height="625"></canvas>
            <video id="cameraVideo" playsinline autoplay muted></video>

            <div id="tattooLayer">
                <canvas id="tattooCanvas" width="300" height="300"></canvas>
            </div>

            <div class="camera-bar">
                <button type="button" class="btn btn-primary" id="snapBtn">📸 Spraviť fotku</button>
                <button type="button" class="btn" id="closeCamBtn">✖ Zavrieť</button>
            </div>
        </div>

        <div class="row-actions">
            <button type="button" class="btn btn-sm" id="clearPhotoBtn">🗑️ Vymazať fotku</button>
            <button type="button" class="btn btn-sm" id="resetMotifBtn">🔄 Reset motívu</button>
        </div>

        <div class="tabs" id="styleTabs">
            <button type="button" class="tab active" data-style="all">Všetky</button>
            <button type="button" class="tab" data-style="realism">Realizmus</button>
            <button type="button" class="tab" data-style="blackwork">Blackwork</button>
            <button type="button" class="tab" data-style="fineline">Fine Line</button>
            <button type="button" class="tab" data-style="japanese">Japonský</button>
        </div>

        <div class="gallery" id="gallery"></div>

        <div class="panel">
            <div class="ctrl">
                <label>Filtre tetovania</label>
                <div class="preset-row" id="presetChips">
                    <button type="button" class="chip active" data-preset="noWhite">Bez bielej</button>
                    <button type="button" class="chip" data-preset="fresh">Čerstvý atrament</button>
                    <button type="button" class="chip" data-preset="healed">Zahojené</button>
                    <button type="button" class="chip" data-preset="vintage">Starší atrament</button>
                    <button type="button" class="chip" data-preset="soft">Jemný tieň</button>
                    <button type="button" class="chip" data-preset="bold">Hlboký čierny</button>
                    <button type="button" class="chip" data-preset="faded">Vyblednuté</button>
                    <button type="button" class="chip" data-preset="sharp">Ostrá linka</button>
                </div>
            </div>

            <div class="grid-2">
                <div class="ctrl">
                    <label>Režim splynutia</label>
                    <select id="blendSelect">
                        <option value="multiply" selected>Multiply (splynutie s kožou)</option>
                        <option value="darken">Darken</option>
                        <option value="color-burn">Color Burn</option>
                        <option value="hard-light">Hard Light</option>
                        <option value="overlay">Overlay</option>
                        <option value="normal">Normal</option>
                    </select>
                </div>

                <div class="ctrl">
                    <label>Filter pokožky</label>
                    <select id="skinFilterSelect">
                        <option value="none" selected>Prirodzená koža</option>
                        <option value="grayscale(100%) contrast(115%)">Čiernobiely (B&amp;W)</option>
                        <option value="sepia(35%) contrast(108%)">Teplý tón</option>
                        <option value="contrast(125%)">Vyšší kontrast</option>
                        <option value="brightness(93%) contrast(115%)">Tlmené svetlo</option>
                    </select>
                </div>
            </div>

            <div class="grid-2">
                <div class="ctrl">
                    <label>Rozmer <span id="sizeVal">15 cm</span></label>
                    <input type="range" id="sizeRange" min="5" max="35" value="15" />
                </div>

                <div class="ctrl">
                    <label>Rotácia <span id="rotVal">0°</span></label>
                    <input type="range" id="rotRange" min="-180" max="180" value="0" />
                </div>

                <div class="ctrl">
                    <label>Kontrast <span id="conVal">165%</span></label>
                    <input type="range" id="conRange" min="60" max="260" value="165" />
                </div>

                <div class="ctrl">
                    <label>Jas <span id="briVal">98%</span></label>
                    <input type="range" id="briRange" min="60" max="150" value="98" />
                </div>

                <div class="ctrl">
                    <label>Krytie <span id="opVal">90%</span></label>
                    <input type="range" id="opRange" min="15" max="100" value="90" />
                </div>

                <div class="ctrl">
                    <label>Rozmazanie <span id="blurVal">0.5px</span></label>
                    <input type="range" id="blurRange" min="0" max="4" step="0.1" value="0.5" />
                </div>

                <div class="ctrl">
                    <label>Mazanie bielej <span id="cutVal">215</span></label>
                    <input type="range" id="cutRange" min="0" max="255" value="215" />
                </div>

                <div class="ctrl">
                    <label>Zjemnenie bokov <span id="edgeVal">28%</span></label>
                    <input type="range" id="edgeRange" min="0" max="60" value="28" />
                </div>
            </div>
        </div>

        <div class="row-actions">
            <button type="button" class="btn" id="uploadMotifBtn">+ Vlastný motív</button>
            <button type="button" class="btn btn-primary" id="saveBtn">💾 Uložiť náhľad</button>
        </div>
    </div>

    <div class="save-modal" id="saveModal">
        <div class="save-card">
            <img id="saveResultImg" alt="Výsledný náhľad" />
            <div class="save-hint">Podrž prst na obrázku a daj „Uložiť obrázok“</div>
            <button type="button" class="btn btn-primary" id="closeSaveModal">Zavrieť</button>
        </div>
    </div>

    <script>
        function drawHandOnCanvas(canvas) {
            canvas.width = 500;
            canvas.height = 625;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#19191e";
            ctx.fillRect(0, 0, 500, 625);
            ctx.fillStyle = "#d9a282";
            ctx.beginPath();
            ctx.moveTo(180, 625);
            ctx.lineTo(200, 270);
            ctx.lineTo(220, 110);
            ctx.lineTo(245, 110);
            ctx.lineTo(255, 190);
            ctx.lineTo(270, 95);
            ctx.lineTo(295, 95);
            ctx.lineTo(295, 200);
            ctx.lineTo(315, 115);
            ctx.lineTo(340, 120);
            ctx.lineTo(315, 280);
            ctx.lineTo(330, 625);
            ctx.closePath();
            ctx.fill();
        }

        function drawPhotoCoverOnCanvas(canvas, sourceEl) {
            const w = 500;
            const h = 625;
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#121216";
            ctx.fillRect(0, 0, w, h);

            const sw = sourceEl.videoWidth || sourceEl.naturalWidth || w;
            const sh = sourceEl.videoHeight || sourceEl.naturalHeight || h;
            if (!sw || !sh) return;

            const scale = Math.max(w / sw, h / sh);
            const dw = sw * scale;
            const dh = sh * scale;
            const dx = (w - dw) / 2;
            const dy = (h - dh) / 2;
            ctx.drawImage(sourceEl, dx, dy, dw, dh);
        }

        function drawMotifShape(ctx, type, w, h) {
            ctx.clearRect(0, 0, w, h);
            ctx.save();
            ctx.translate(w / 2, h / 2);
            const scale = Math.min(w, h) / 300;
            ctx.scale(scale, scale);
            ctx.strokeStyle = "#141414";
            ctx.fillStyle = "#2b2b2b";
            ctx.lineWidth = 4;

            if (type === "rose") {
                for (let i = 0; i < 6; i++) {
                    ctx.save();
                    ctx.rotate((i * Math.PI) / 3);
                    ctx.beginPath();
                    ctx.ellipse(0, -38, 30, 46, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                }
                ctx.fillStyle = "#111111";
                ctx.beginPath();
                ctx.arc(0, 0, 20, 0, Math.PI * 2);
                ctx.fill();
            } else if (type === "geo") {
                ctx.beginPath();
                ctx.arc(0, 0, 95, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, -90);
                ctx.lineTo(78, 48);
                ctx.lineTo(-78, 48);
                ctx.closePath();
                ctx.stroke();
            } else if (type === "line") {
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(0, -105);
                ctx.lineTo(18, -18);
                ctx.lineTo(105, 0);
                ctx.lineTo(18, 18);
                ctx.lineTo(0, 105);
                ctx.lineTo(-18, 18);
                ctx.lineTo(-105, 0);
                ctx.lineTo(-18, -18);
                ctx.closePath();
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.moveTo(-85, 20);
                ctx.quadraticCurveTo(-30, -55, 15, -10);
                ctx.quadraticCurveTo(50, -55, 85, -10);
                ctx.quadraticCurveTo(40, 25, 20, 50);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();
        }

        function renderMotifToCanvas(targetCanvas, motif, whiteCutoff, edgeSoft) {
            const w = 300;
            const h = 300;
            targetCanvas.width = w;
            targetCanvas.height = h;
            const ctx = targetCanvas.getContext("2d");
            ctx.clearRect(0, 0, w, h);

            if (motif && motif.builtinType) {
                drawMotifShape(ctx, motif.builtinType, w, h);
            } else if (motif && motif.imgEl && motif.imgEl.complete && motif.imgEl.naturalWidth) {
                const sw = motif.imgEl.naturalWidth;
                const sh = motif.imgEl.naturalHeight;
                const scale = Math.min(w / sw, h / sh);
                const dw = sw * scale;
                const dh = sh * scale;
                const dx = (w - dw) / 2;
                const dy = (h - dh) / 2;
                ctx.drawImage(motif.imgEl, dx, dy, dw, dh);

                try {
                    if (whiteCutoff > 0) {
                        const frame = ctx.getImageData(0, 0, w, h);
                        const d = frame.data;
                        for (let i = 0; i < d.length; i += 4) {
                            if (d[i + 3] > 0) {
                                const minCh = Math.min(d[i], d[i + 1], d[i + 2]);
                                const avgCh = (d[i] + d[i + 1] + d[i + 2]) / 3;
                                if (avgCh >= whiteCutoff && minCh >= whiteCutoff - 25) {
                                    d[i + 3] = 0;
                                }
                            }
                        }
                        ctx.putImageData(frame, 0, 0);
                    }
                } catch (_) {}
            }

            if (edgeSoft > 0) {
                const fade = Math.min(0.49, edgeSoft / 100);
                ctx.save();
                ctx.globalCompositeOperation = "destination-in";

                const gradX = ctx.createLinearGradient(0, 0, w, 0);
                gradX.addColorStop(0, "rgba(0,0,0,0)");
                gradX.addColorStop(fade, "rgba(0,0,0,1)");
                gradX.addColorStop(1 - fade, "rgba(0,0,0,1)");
                gradX.addColorStop(1, "rgba(0,0,0,0)");
                ctx.fillStyle = gradX;
                ctx.fillRect(0, 0, w, h);

                const gradY = ctx.createLinearGradient(0, 0, 0, h);
                gradY.addColorStop(0, "rgba(0,0,0,0)");
                gradY.addColorStop(fade, "rgba(0,0,0,1)");
                gradY.addColorStop(1 - fade, "rgba(0,0,0,1)");
                gradY.addColorStop(1, "rgba(0,0,0,0)");
                ctx.fillStyle = gradY;
                ctx.fillRect(0, 0, w, h);

                ctx.restore();
            }
        }

        function initApp() {
            const MOTIFS = [
                { id: 1, name: "Ruza", style: "realism", complexity: 1.35, builtinType: "rose" },
                { id: 2, name: "Geo", style: "blackwork", complexity: 1.4, builtinType: "geo" },
                { id: 3, name: "Line", style: "fineline", complexity: 1.1, builtinType: "line" },
                { id: 4, name: "Vlna", style: "japanese", complexity: 1.45, builtinType: "wave" }
            ];

            const state = {
                style: "all",
                motif: MOTIFS[0],
                x: 0,
                y: 0,
                sizeCm: 15,
                rotation: 0,
                opacity: 0.9,
                blur: 0.5,
                contrast: 165,
                brightness: 98,
                whiteCutoff: 215,
                edgeSoft: 28,
                blend: "multiply",
                skinFilter: "none",
                stream: null
            };

            const statusBox = document.getElementById("statusBox");
            const stage = document.getElementById("stage");
            const bodyCanvas = document.getElementById("bodyCanvas");
            const cameraVideo = document.getElementById("cameraVideo");
            const tattooLayer = document.getElementById("tattooLayer");
            const tattooCanvas = document.getElementById("tattooCanvas");
            const gallery = document.getElementById("gallery");
            const priceDisplay = document.getElementById("priceDisplay");
            const cameraBtn = document.getElementById("cameraBtn");
            const uploadBodyBtn = document.getElementById("uploadBodyBtn");
            const uploadMotifBtn = document.getElementById("uploadMotifBtn");
            const bodyFileInput = document.getElementById("bodyFileInput");
            const nativeCamInput = document.getElementById("nativeCamInput");
            const tattooFileInput = document.getElementById("tattooFileInput");
            const snapBtn = document.getElementById("snapBtn");
            const closeCamBtn = document.getElementById("closeCamBtn");
            const clearPhotoBtn = document.getElementById("clearPhotoBtn");
            const resetMotifBtn = document.getElementById("resetMotifBtn");
            const saveBtn = document.getElementById("saveBtn");
            const saveModal = document.getElementById("saveModal");
            const saveResultImg = document.getElementById("saveResultImg");
            const closeSaveModal = document.getElementById("closeSaveModal");

            if (bodyCanvas) drawHandOnCanvas(bodyCanvas);

            function showStatus(msg) {
                if (!statusBox) return;
                statusBox.textContent = msg;
                statusBox.style.display = msg ? "block" : "none";
            }

            function updatePrice() {
                if (!priceDisplay) return;
                const ratio = (state.sizeCm - 5) / 30;
                const euros = Math.max(50, Math.min(300, Math.round((50 + ratio * 185 * (state.motif.complexity || 1.2)) / 5) * 5));
                priceDisplay.textContent = `Odhad ceny: ${euros} €`;
            }

            function syncSlidersFromState() {
                const bs = document.getElementById("blendSelect");
                if (bs) bs.value = state.blend;
                const sf = document.getElementById("skinFilterSelect");
                if (sf) sf.value = state.skinFilter;
                const setVal = (id, v) => { const n = document.getElementById(id); if (n) n.value = v; };
                setVal("sizeRange", state.sizeCm);
                setVal("rotRange", state.rotation);
                setVal("opRange", Math.round(state.opacity * 100));
                setVal("blurRange", state.blur);
                setVal("conRange", state.contrast);
                setVal("briRange", state.brightness);
                setVal("cutRange", state.whiteCutoff);
                setVal("edgeRange", state.edgeSoft);
            }

            function redrawMotifCanvas() {
                renderMotifToCanvas(tattooCanvas, state.motif, state.whiteCutoff, state.edgeSoft);
            }

            function applyView() {
                if (tattooCanvas) {
                    const w = Math.round(70 + ((state.sizeCm - 5) / 30) * 230);
                    tattooCanvas.style.width = `${w}px`;
                    tattooCanvas.style.height = `${w}px`;
                    tattooCanvas.style.mixBlendMode = state.blend;
                    tattooCanvas.style.opacity = String(state.opacity);
                    tattooCanvas.style.filter = `blur(${state.blur}px) contrast(${state.contrast}%) brightness(${state.brightness}%)`;
                }
                if (tattooLayer) {
                    tattooLayer.style.transform = `translate(calc(-50% + ${state.x}px), calc(-50% + ${state.y}px)) rotate(${state.rotation}deg)`;
                }
                if (bodyCanvas) bodyCanvas.style.filter = state.skinFilter;
                if (cameraVideo) cameraVideo.style.filter = state.skinFilter;

                const labels = {
                    sizeVal: `${state.sizeCm} cm`,
                    rotVal: `${state.rotation}°`,
                    opVal: `${Math.round(state.opacity * 100)}%`,
                    blurVal: `${state.blur}px`,
                    conVal: `${state.contrast}%`,
                    briVal: `${state.brightness}%`,
                    cutVal: `${state.whiteCutoff}`,
                    edgeVal: `${state.edgeSoft}%`
                };
                Object.keys(labels).forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.textContent = labels[id];
                });
                updatePrice();
            }

            function renderGallery() {
                if (!gallery) return;
                gallery.innerHTML = "";
                const items = state.style === "all" ? MOTIFS : MOTIFS.filter(m => m.style === state.style || m.id === state.motif.id);
                items.forEach(m => {
                    const card = document.createElement("div");
                    card.className = "thumb" + (state.motif.id === m.id ? " active" : "");
                    const c = document.createElement("canvas");
                    renderMotifToCanvas(c, m, state.whiteCutoff, state.edgeSoft);
                    card.appendChild(c);
                    card.addEventListener("click", () => {
                        state.motif = m;
                        renderGallery();
                        redrawMotifCanvas();
                        applyView();
                    });
                    gallery.appendChild(card);
                });
            }

            function stopCamera() {
                if (state.stream) {
                    state.stream.getTracks().forEach(t => t.stop());
                    state.stream = null;
                }
                if (stage) stage.classList.remove("camera-on");
            }

            function loadImageFromFile(file, onLoaded) {
                const reader = new FileReader();
                reader.onload = () => {
                    const img = new Image();
                    img.onload = () => onLoaded(img);
                    img.onerror = () => {
                        const url = URL.createObjectURL(file);
                        const img2 = new Image();
                        img2.onload = () => {
                            onLoaded(img2);
                            URL.revokeObjectURL(url);
                        };
                        img2.src = url;
                    };
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            }

            function applyUploadedBodyFile(file) {
                if (!file || !bodyCanvas) return;
                stopCamera();
                showStatus("");
                loadImageFromFile(file, img => {
                    drawPhotoCoverOnCanvas(bodyCanvas, img);
                });
            }

            if (uploadBodyBtn && bodyFileInput) {
                uploadBodyBtn.addEventListener("click", () => {
                    bodyFileInput.value = "";
                    bodyFileInput.click();
                });
            }

            if (uploadMotifBtn && tattooFileInput) {
                uploadMotifBtn.addEventListener("click", () => {
                    tattooFileInput.value = "";
                    tattooFileInput.click();
                });
            }

            if (clearPhotoBtn) {
                clearPhotoBtn.addEventListener("click", () => {
                    stopCamera();
                    showStatus("");
                    if (bodyCanvas) drawHandOnCanvas(bodyCanvas);
                });
            }

            if (resetMotifBtn) {
                resetMotifBtn.addEventListener("click", () => {
                    showStatus("");
                    state.x = 0;
                    state.y = 0;
                    state.sizeCm = 15;
                    state.rotation = 0;
                    state.opacity = 0.9;
                    state.blur = 0.5;
                    state.contrast = 165;
                    state.brightness = 98;
                    state.whiteCutoff = 215;
                    state.edgeSoft = 28;
                    state.blend = "multiply";
                    state.skinFilter = "none";
                    syncSlidersFromState();
                    renderGallery();
                    redrawMotifCanvas();
                    applyView();
                });
            }

            if (cameraBtn) {
                cameraBtn.addEventListener("click", async () => {
                    showStatus("");
                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                        if (nativeCamInput) {
                            nativeCamInput.value = "";
                            nativeCamInput.click();
                        }
                        return;
                    }
                    try {
                        stopCamera();
                        const stream = await navigator.mediaDevices.getUserMedia({
                            video: { facingMode: "environment" },
                            audio: false
                        });
                        state.stream = stream;
                        if (cameraVideo) {
                            cameraVideo.srcObject = stream;
                            await cameraVideo.play();
                        }
                        if (stage) stage.classList.add("camera-on");
                    } catch (_) {
                        if (nativeCamInput) {
                            nativeCamInput.value = "";
                            nativeCamInput.click();
                        } else {
                            showStatus("Kamera sa neotvorila. Skús Nahrať fotku.");
                        }
                    }
                });
            }

            if (nativeCamInput) {
                nativeCamInput.addEventListener("change", e => {
                    const file = e.target.files && e.target.files[0];
                    if (file) applyUploadedBodyFile(file);
                });
            }

            if (closeCamBtn) {
                closeCamBtn.addEventListener("click", () => {
                    stopCamera();
                    showStatus("");
                });
            }

            if (snapBtn) {
                snapBtn.addEventListener("click", () => {
                    if (cameraVideo && bodyCanvas) {
                        drawPhotoCoverOnCanvas(bodyCanvas, cameraVideo);
                    }
                    stopCamera();
                });
            }

            if (bodyFileInput) {
                bodyFileInput.addEventListener("change", e => {
                    const file = e.target.files && e.target.files[0];
                    if (file) applyUploadedBodyFile(file);
                });
            }

            if (tattooFileInput) {
                tattooFileInput.addEventListener("change", e => {
                    const file = e.target.files && e.target.files[0];
                    if (!file) return;
                    showStatus("");
                    loadImageFromFile(file, imgEl => {
                        const custom = { id: Date.now(), name: file.name, style: "all", complexity: 1.25, imgEl };
                        MOTIFS.unshift(custom);
                        state.motif = custom;
                        state.style = "all";
                        document.querySelectorAll(".tab").forEach(t => {
                            t.classList.toggle("active", t.dataset.style === "all");
                        });
                        renderGallery();
                        redrawMotifCanvas();
                        applyView();
                    });
                });
            }

            document.querySelectorAll(".tab").forEach(tab => {
                tab.addEventListener("click", () => {
                    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
                    tab.classList.add("active");
                    state.style = tab.dataset.style || "all";
                    renderGallery();
                });
            });

            document.querySelectorAll(".chip").forEach(chip => {
                chip.addEventListener("click", () => {
                    document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
                    chip.classList.add("active");
                    const p = chip.dataset.preset;
                    if (p === "noWhite") { state.blend = "multiply"; state.opacity = 0.92; state.blur = 0.5; state.contrast = 175; state.brightness = 96; state.whiteCutoff = 215; state.edgeSoft = 28; }
                    else if (p === "fresh") { state.blend = "multiply"; state.opacity = 0.88; state.blur = 0.6; state.contrast = 155; state.brightness = 98; state.whiteCutoff = 225; state.edgeSoft = 24; }
                    else if (p === "healed") { state.blend = "multiply"; state.opacity = 0.7; state.blur = 1.2; state.contrast = 135; state.brightness = 102; state.whiteCutoff = 230; state.edgeSoft = 34; }
                    else if (p === "vintage") { state.blend = "multiply"; state.opacity = 0.62; state.blur = 1.0; state.contrast = 125; state.brightness = 104; state.whiteCutoff = 235; state.edgeSoft = 36; }
                    else if (p === "soft") { state.blend = "multiply"; state.opacity = 0.58; state.blur = 1.8; state.contrast = 120; state.brightness = 104; state.whiteCutoff = 230; state.edgeSoft = 40; }
                    else if (p === "bold") { state.blend = "color-burn"; state.opacity = 0.94; state.blur = 0.4; state.contrast = 200; state.brightness = 94; state.whiteCutoff = 210; state.edgeSoft = 22; }
                    else if (p === "faded") { state.blend = "multiply"; state.opacity = 0.45; state.blur = 1.5; state.contrast = 110; state.brightness = 108; state.whiteCutoff = 235; state.edgeSoft = 38; }
                    else if (p === "sharp") { state.blend = "multiply"; state.opacity = 0.92; state.blur = 0.0; state.contrast = 190; state.brightness = 96; state.whiteCutoff = 210; state.edgeSoft = 15; }

                    syncSlidersFromState();
                    renderGallery();
                    redrawMotifCanvas();
                    applyView();
                });
            });

            const bind = (id, fn) => {
                const n = document.getElementById(id);
                if (n) n.addEventListener(n.tagName === "SELECT" ? "change" : "input", () => fn(n.value));
            };
            bind("blendSelect", v => { state.blend = v; applyView(); });
            bind("skinFilterSelect", v => { state.skinFilter = v; applyView(); });
            bind("sizeRange", v => { state.sizeCm = Number(v); applyView(); });
            bind("rotRange", v => { state.rotation = Number(v); applyView(); });
            bind("opRange", v => { state.opacity = Number(v) / 100; applyView(); });
            bind("blurRange", v => { state.blur = Number(v); applyView(); });
            bind("conRange", v => { state.contrast = Number(v); applyView(); });
            bind("briRange", v => { state.brightness = Number(v); applyView(); });
            bind("cutRange", v => { state.whiteCutoff = Number(v); renderGallery(); redrawMotifCanvas(); applyView(); });
            bind("edgeRange", v => { state.edgeSoft = Number(v); renderGallery(); redrawMotifCanvas(); applyView(); });

            if (tattooLayer) {
                let drag = null;
                tattooLayer.addEventListener("pointerdown", e => {
                    e.preventDefault();
                    tattooLayer.setPointerCapture(e.pointerId);
                    drag = { x: e.clientX - state.x, y: e.clientY - state.y };
                });
                tattooLayer.addEventListener("pointermove", e => {
                    if (!drag) return;
                    state.x = Math.round(e.clientX - drag.x);
                    state.y = Math.round(e.clientY - drag.y);
                    applyView();
                });
                tattooLayer.addEventListener("pointerup", () => { drag = null; });
                tattooLayer.addEventListener("pointercancel", () => { drag = null; });
            }

            if (closeSaveModal && saveModal) {
                closeSaveModal.addEventListener("click", () => {
                    saveModal.classList.remove("open");
                });
            }

            if (saveBtn && stage && bodyCanvas && tattooCanvas && saveResultImg && saveModal) {
                saveBtn.addEventListener("click", () => {
                    showStatus("");
                    const out = document.createElement("canvas");
                    out.width = 600;
                    out.height = 750;
                    const ctx = out.getContext("2d");

                    ctx.save();
                    ctx.filter = state.skinFilter || "none";
                    ctx.drawImage(bodyCanvas, 0, 0, 600, 750);
                    ctx.restore();

                    const stageRect = stage.getBoundingClientRect();
                    const scaleX = stageRect.width ? 600 / stageRect.width : 1;
                    const scaleY = stageRect.height ? 750 / stageRect.height : 1;
                    const sizePx = tattooCanvas.getBoundingClientRect().width;

                    ctx.save();
                    const cx = 300 + state.x * scaleX;
                    const cy = 375 + state.y * scaleY;
                    const dw = sizePx * scaleX;
                    const dh = sizePx * scaleY;
                    ctx.translate(cx, cy);
                    ctx.rotate((state.rotation * Math.PI) / 180);
                    ctx.globalCompositeOperation = state.blend === "normal" ? "source-over" : state.blend;
                    ctx.globalAlpha = state.opacity;
                    ctx.filter = `blur(${state.blur}px) contrast(${state.contrast}%) brightness(${state.brightness}%)`;
                    ctx.drawImage(tattooCanvas, -dw / 2, -dh / 2, dw, dh);
                    ctx.restore();

                    try {
                        saveResultImg.src = out.toDataURL("image/png");
                        saveModal.classList.add("open");
                    } catch (_) {
                        showStatus("Nepodarilo sa vytvoriť obrázok na uloženie.");
                    }
                });
            }

            renderGallery();
            redrawMotifCanvas();
            applyView();
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initApp);
        } else {
            initApp();
        }
    </script>
</body>
</html>
