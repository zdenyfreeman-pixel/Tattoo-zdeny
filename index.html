<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InkPreview AR - Realistický náhľad tetovania</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <!-- Hlavička -->
    <header>
        <h1>INK<span>PREVIEW</span></h1>
        <div class="price-badge">
            <span>Odhad ceny:</span>
            <strong id="priceDisplay">85 €</strong>
        </div>
    </header>

    <!-- Hlavné plátno (Fotoaparát / Fotka + Tetovanie) -->
    <main class="canvas-wrapper" id="canvasWrapper">
        <video id="cameraStream" autoplay playsinline hidden></video>
        <img id="bodyImage" src="https://images.unsplash.com/photo-1515377905703-c4788e51af15?auto=format&fit=crop&w=800&q=80" alt="Časť tela">
        
        <!-- Vrstva tetovania -->
        <div id="tattooLayer" class="tattoo-overlay">
            <img id="tattooImg" src="" alt="Tetovanie">
        </div>

        <!-- Tlačidlá pre kameru a fotku -->
        <div class="camera-controls">
            <button id="startCameraBtn" class="btn-icon">📷 Odfotiť telo</button>
            <button id="captureBtn" class="btn-icon primary" hidden>📸 Zachytiť fotku</button>
            <label class="btn-icon">
                🖼️ Nahrať fotku
                <input type="file" id="uploadBodyInput" accept="image/*" hidden>
            </label>
        </div>
    </main>

    <!-- Ovládací panel -->
    <section class="controls-panel">
        <!-- Výber štýlu -->
        <div class="tabs" id="styleTabs">
            <button class="tab active" data-style="all">Všetky</button>
            <button class="tab" data-style="realism">Realizmus</button>
            <button class="tab" data-style="blackwork">Blackwork</button>
            <button class="tab" data-style="fineline">Fine Line</button>
            <button class="tab" data-style="japanese">Japonské</button>
        </div>

        <!-- Galéria tetovaní -->
        <div class="tattoo-gallery" id="tattooGallery">
            <!-- Generované cez JS -->
        </div>

        <!-- Posuvníky pre realizmus na koži a rozmer -->
        <div class="sliders-grid">
            <div class="control-group">
                <label>Rozmer: <span id="sizeVal">10</span> cm</label>
                <input type="range" id="sizeSlider" min="3" max="30" value="10">
            </div>

            <div class="control-group">
                <label>Rotácia: <span id="rotateVal">0</span>°</label>
                <input type="range" id="rotateSlider" min="-180" max="180" value="0">
            </div>

            <div class="control-group">
                <label>Splynutie s kožou (Krytie): <span id="opacityVal">85</span>%</label>
                <input type="range" id="opacitySlider" min="30" max="100" value="85">
            </div>

            <div class="control-group">
                <label>Efekt zahojenia (Rozmazanie): <span id="blurVal">0.4</span>px</label>
                <input type="range" id="blurSlider" min="0" max="2" step="0.1" value="0.4">
            </div>

            <div class="control-group">
                <label>Kontrast atramentu: <span id="contrastVal">115</span>%</label>
                <input type="range" id="contrastSlider" min="70" max="160" value="115">
            </div>

            <div class="control-group">
                <label>Filter kože:</label>
                <select id="blendModeSelect">
                    <option value="multiply" selected>Realistický atrament (Multiply)</option>
                    <option value="darken">Tmavá koža (Darken)</option>
                    <option value="color-burn">Hlboký tieň (Color Burn)</option>
                    <option value="normal">Čerstvé tetovanie (Normal)</option>
                </select>
            </div>
        </div>

        <!-- Akčné tlačidlá -->
        <div class="footer-actions">
            <label class="btn-secondary">
                ➕ Vlastný motív
                <input type="file" id="uploadTattooInput" accept="image/*" hidden>
            </label>
            <button id="saveResultBtn" class="btn-primary">💾 Uložiť náhľad</button>
        </div>
    </section>
</div>

<script src="app.js"></script>
</body>
</html>
