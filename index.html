<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INKPREVIEW</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="brand">INKPREVIEW</div>
            <div class="price-pill" id="priceDisplay">Odhad ceny: 100 €</div>
        </header>

        <div class="row-actions">
            <label class="btn btn-primary" for="cameraInput">📷 Odfotiť telo</label>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" />

            <label class="btn" for="bodyFileInput">🖼️ Nahrať fotku</label>
            <input type="file" id="bodyFileInput" accept="image/*" />
        </div>

        <div class="stage" id="stage">
            <img id="bodyImg" alt="Náhľad tela" />
            <div id="tattooLayer">
                <img id="tattooImg" alt="Náhľad motívu" />
            </div>
        </div>

        <div class="tabs" id="styleTabs">
            <button type="button" class="tab active" data-style="all">Všetky</button>
            <button type="button" class="tab" data-style="realism">Realizmus</button>
            <button type="button" class="tab" data-style="blackwork">Blackwork</button>
            <button type="button" class="tab" data-style="fineline">Fine Line</button>
            <button type="button" class="tab" data-style="japanese">Japonský</button>
        </div>

        <div class="gallery" id="gallery"></div>

        <div class="panel">
            <div class="ctrl">
                <label>Rýchle filtre</label>
                <div class="preset-row" id="presetChips">
                    <button type="button" class="chip active" data-preset="fresh">Čerstvý atrament</button>
                    <button type="button" class="chip" data-preset="noWhite">Bez bieleho pozadia</button>
                    <button type="button" class="chip" data-preset="healed">Zahojené</button>
                    <button type="button" class="chip" data-preset="soft">Jemný tieň</button>
                    <button type="button" class="chip" data-preset="bold">Výrazný čierny</button>
                </div>
            </div>

            <div class="grid-2">
                <div class="ctrl">
                    <label>Režim splynutia</label>
                    <select id="blendSelect">
                        <option value="multiply" selected>Multiply (bez bielej)</option>
                        <option value="darken">Darken</option>
                        <option value="color-burn">Color Burn</option>
                        <option value="hard-light">Hard Light</option>
                        <option value="overlay">Overlay</option>
                        <option value="normal">Normal</option>
                    </select>
                </div>

                <div class="ctrl">
                    <label>Filter pokožky</label>
                    <select id="skinFilterSelect">
                        <option value="none" selected>Prirodzená koža</option>
                        <option value="grayscale(100%) contrast(112%)">Čiernobiely (B&amp;W)</option>
                        <option value="sepia(30%) contrast(108%)">Teplý tón</option>
                        <option value="contrast(120%)">Vyšší kontrast</option>
                        <option value="brightness(94%) contrast(112%)">Tlmené svetlo</option>
                    </select>
                </div>
            </div>

            <div class="grid-2">
                <div class="ctrl">
                    <label>Rozmer <span id="sizeVal">15 cm</span></label>
                    <input type="range" id="sizeRange" min="5" max="35" value="15" />
                </div>

                <div class="ctrl">
                    <label>Rotácia <span id="rotVal">0°</span></label>
                    <input type="range" id="rotRange" min="-180" max="180" value="0" />
                </div>

                <div class="ctrl">
                    <label>Krytie <span id="opVal">85%</span></label>
                    <input type="range" id="opRange" min="15" max="100" value="85" />
                </div>

                <div class="ctrl">
                    <label>Rozmazanie <span id="blurVal">0.6px</span></label>
                    <input type="range" id="blurRange" min="0" max="4" step="0.2" value="0.6" />
                </div>

                <div class="ctrl">
                    <label>Kontrast <span id="conVal">140%</span></label>
                    <input type="range" id="conRange" min="60" max="240" value="140" />
                </div>

                <div class="ctrl">
                    <label>Jas <span id="briVal">100%</span></label>
                    <input type="range" id="briRange" min="60" max="150" value="100" />
                </div>
            </div>
        </div>

        <div class="row-actions">
            <label class="btn" for="tattooFileInput">+ Vlastný motív</label>
            <input type="file" id="tattooFileInput" accept="image/*" />

            <button type="button" class="btn btn-primary" id="saveBtn">💾 Uložiť náhľad</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
